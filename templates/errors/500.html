{% extends 'base.html' %}

{% block title %}System Error - 500{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full glass rounded-[40px] p-12 text-center relative overflow-hidden" data-animate>
        <!-- Background Accents -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-red-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl"></div>

        <h1 class="font-display text-8xl font-black text-white/10 mb-2 select-none">500</h1>
        
        <div class="relative z-10">
            <div class="w-20 h-20 rounded-3xl bg-red-500/10 flex items-center justify-center mx-auto mb-6">
                <i data-lucide="shield-alert" class="w-10 h-10 text-red-400"></i>
            </div>
            
            <h2 class="font-display text-2xl font-bold text-white mb-2">Something went wrong</h2>
            <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                Our servers encountered an unexpected issue. We've been notified and are on it!
            </p>
            
            <div class="flex flex-col gap-3">
                <button onclick="location.reload()" class="btn-primary py-3 rounded-xl text-sm font-semibold text-white flex items-center justify-center gap-2">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    Try Again
                </a>
                <a href="{{ url_for('index') }}" class="btn-secondary py-3 rounded-xl text-sm font-semibold text-slate-300 flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
