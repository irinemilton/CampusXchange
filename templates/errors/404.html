{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full glass rounded-[40px] p-12 text-center relative overflow-hidden" data-animate>
        <!-- Background Accents -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl"></div>

        <h1 class="font-display text-8xl font-black text-white/10 mb-2 select-none">404</h1>
        
        <div class="relative z-10">
            <div class="w-20 h-20 rounded-3xl bg-indigo-500/10 flex items-center justify-center mx-auto mb-6">
                <i data-lucide="compass" class="w-10 h-10 text-indigo-400"></i>
            </div>
            
            <h2 class="font-display text-2xl font-bold text-white mb-2">Lost in the Marketplace?</h2>
            <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                We couldn't find the page you're looking for. It might have been traded or moved.
            </p>
            
            <div class="flex flex-col gap-3">
                <a href="{{ url_for('index') }}" class="btn-primary py-3 rounded-xl text-sm font-semibold text-white flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    Back to Home
                </a>
                <a href="{{ url_for('marketplace') }}" class="btn-secondary py-3 rounded-xl text-sm font-semibold text-slate-300 flex items-center justify-center gap-2">
                    <i data-lucide="store" class="w-4 h-4"></i>
                    Browse Marketplace
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
