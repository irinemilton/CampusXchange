{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-20 px-4 relative">
    <!-- Background Effects -->
    <div class="absolute top-1/3 right-1/4 w-72 h-72 bg-emerald-600/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/3 left-1/4 w-72 h-72 bg-indigo-600/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md relative z-10 animate-slide-up">
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-500/25">
                    ♻️
                </div>
            </a>
            <h1 class="font-display text-3xl font-bold text-white mb-2">Set New Password</h1>
            <p class="text-sm text-slate-400">Choose a strong password for your CampusXchange account</p>
        </div>

        <!-- Form Card -->
        <div class="glass rounded-3xl p-8">
            <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="space-y-6" id="reset-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">New Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
                        <input type="password" name="password" id="reset-password" required minlength="6"
                               class="input-field w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500"
                               placeholder="Minimum 6 characters"
                               autocomplete="new-password">
                        <button type="button" onclick="togglePassword('reset-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <!-- Password strength indicator -->
                    <div class="flex gap-1 mt-2" id="password-strength">
                        <div class="h-1 flex-1 rounded-full bg-slate-800 transition-colors"></div>
                        <div class="h-1 flex-1 rounded-full bg-slate-800 transition-colors"></div>
                        <div class="h-1 flex-1 rounded-full bg-slate-800 transition-colors"></div>
                        <div class="h-1 flex-1 rounded-full bg-slate-800 transition-colors"></div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Confirm New Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
                        <input type="password" name="confirm_password" id="reset-confirm" required
                               class="input-field w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500"
                               placeholder="Confirm your new password"
                               autocomplete="new-password">
                        <button type="button" onclick="togglePassword('reset-confirm', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p id="match-msg" class="text-xs mt-1.5 hidden"></p>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-primary w-full py-3.5 rounded-xl text-sm font-semibold text-white flex items-center justify-center gap-2" id="reset-submit">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>Reset Password</span>
                </button>
            </form>

            <!-- Back -->
            <p class="text-center text-sm text-slate-400 mt-6">
                <a href="{{ url_for('login') }}" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors inline-flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    Back to Sign In
                </a>
            </p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Password strength indicator
    document.getElementById('reset-password').addEventListener('input', function() {
        const bars = document.querySelectorAll('#password-strength div');
        const val = this.value;
        let strength = 0;

        if (val.length >= 6) strength++;
        if (val.length >= 8) strength++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
        if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) strength++;

        const colors = ['bg-red-500', 'bg-amber-500', 'bg-yellow-400', 'bg-emerald-500'];
        bars.forEach((bar, i) => {
            bar.className = 'h-1 flex-1 rounded-full transition-colors ' +
                (i < strength ? colors[strength - 1] : 'bg-slate-800');
        });
    });

    // Password match live validation
    const confirmInput = document.getElementById('reset-confirm');
    const matchMsg = document.getElementById('match-msg');

    confirmInput.addEventListener('input', function() {
        const pass = document.getElementById('reset-password').value;
        if (!this.value) { matchMsg.classList.add('hidden'); return; }

        if (this.value === pass) {
            matchMsg.textContent = '✓ Passwords match';
            matchMsg.className = 'text-xs mt-1.5 text-emerald-400';
            this.classList.remove('ring-2', 'ring-red-500/40');
            this.classList.add('ring-2', 'ring-emerald-500/40');
        } else {
            matchMsg.textContent = '✗ Passwords do not match';
            matchMsg.className = 'text-xs mt-1.5 text-red-400';
            this.classList.remove('ring-2', 'ring-emerald-500/40');
            this.classList.add('ring-2', 'ring-red-500/40');
        }
    });

    // Prevent submit if passwords don't match
    document.getElementById('reset-form').addEventListener('submit', function(e) {
        const pass = document.getElementById('reset-password').value;
        const confirm = document.getElementById('reset-confirm').value;
        if (pass !== confirm) {
            e.preventDefault();
            confirmInput.dispatchEvent(new Event('input'));
            confirmInput.focus();
        }
    });
</script>
{% endblock %}
